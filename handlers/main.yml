---
  - name: Restart sing-box
    service:
      name: sing-box
      state: restarted

  - name: Restart network
    service:
      name: network
      state: reloaded

  - name: Install vpn route
    command: /etc/hotplug.d/iface/30-vpnroute

  - name: Restart firewall
    service:
      name: firewall
      state: restarted

  - name: Run getdomains script
    service:
      name: getdomains
      state: restarted

  - name: Restart dnscrypt-proxy
    service:
      name: dnscrypt-proxy
      state: restarted
      enabled: yes
      
  - name: Restart dnsmasq
    service:
      name: dnsmasq
      state: restarted
