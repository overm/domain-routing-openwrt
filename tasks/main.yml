---
- name: Read OpenWrt release information
  shell: ". /etc/os-release && printf '%s' \"${VERSION_ID%%.*}\""
  register: openwrt_major_release
  changed_when: false

- name: Require OpenWrt 25 or newer
  assert:
    that:
      - openwrt_major_release.stdout | int >= 25
    fail_msg: "This role supports OpenWrt 25 and newer only."

- name: Require sing-box
  assert:
    that:
      - tunnel == "singbox"
    fail_msg: "singbox is the only supported tunnel."

- name: Validate list refresh settings
  assert:
    that:
      - not list_domains or country in domain_list_urls
      - getdomains_connect_timeout | int > 0
      - getdomains_max_time | int > 0
      - getdomains_retries | int >= 0
      - getdomains_ready_timeout | int > 0
      - getdomains_download_interface is match('^[A-Za-z0-9_.:-]+$')
    fail_msg: "Invalid country or getdomains download settings."

- name: Validate the tunnel DNS address
  assert:
    that:
      - >-
        wdns == false or
        (wdns | string) is match('^((0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}(0|[1-9][0-9]?|1[0-9]{2}|2[0-4][0-9]|25[0-5])$')
    fail_msg: "wdns must be false or a valid IPv4 DNS server address."

- name: Refresh apk indexes
  command: apk update
  changed_when: false

- name: Install required packages with apk
  shell: "apk info -e {{ item }} >/dev/null 2>&1 || apk add {{ item }}"
  loop: "{{ ['curl', 'ip-full', 'sing-box'] + (['nano'] if nano else []) }}"
  register: apk_packages
  changed_when: "'Installing' in apk_packages.stdout or 'OK:' in apk_packages.stdout"

- name: Install dnsmasq-full for domain sets
  shell: "apk info -e dnsmasq-full >/dev/null 2>&1 || apk add dnsmasq-full"
  when: list_domains
  register: apk_dnsmasq_full
  changed_when: "'Installing' in apk_dnsmasq_full.stdout or 'OK:' in apk_dnsmasq_full.stdout"
  notify: Restart dnsmasq

- name: Configure dnsmasq runtime include directory
  uci:
    command: set
    key: dhcp.@dnsmasq[0]
    value:
      confdir: /tmp/dnsmasq.d
  notify: Restart dnsmasq

- name: Configure the icanhazip.com domain set mapping
  uci:
    command: section
    config: dhcp
    type: ipset
    name: vpn_icanhazip
    value:
      name:
        - vpn_domains
      domain:
        - icanhazip.com
      table: fw4
      table_family: inet
  when:
    - list_domains | bool
    - add_icanhazip_domain | bool
  notify: Restart dnsmasq

- name: Remove the icanhazip.com domain set mapping when disabled
  uci:
    command: absent
    key: dhcp.vpn_icanhazip
  when: not list_domains | bool or not add_icanhazip_domain | bool
  notify: Restart dnsmasq

- name: Configure the wdns DHCP tag
  uci:
    command: section
    config: dhcp
    type: tag
    name: wdns
    value:
      dhcp_option:
        - "6,{{ wdns }}"
  when: wdns != false
  notify: Restart dnsmasq

- name: Remove the wdns DHCP tag when disabled
  uci:
    command: absent
    key: dhcp.wdns
  when: wdns == false
  notify: Restart dnsmasq

- name: Install getdomains init script
  template:
    src: openwrt-getdomains.j2
    dest: /etc/init.d/getdomains
    mode: "0755"
    trim_blocks: false
  notify: Run getdomains script

- name: Enable getdomains at boot
  command: /etc/init.d/getdomains enable
  args:
    creates: /etc/rc.d/S99getdomains

- name: Schedule list refresh
  lineinfile:
    path: /etc/crontabs/root
    create: true
    line: "0 4 * * * /etc/init.d/getdomains start"

- name: Enable and start cron
  service:
    name: cron
    state: started
    enabled: true

- name: Install sing-box route hotplug script
  template:
    src: openwrt-30-vpnroute.j2
    dest: /etc/hotplug.d/iface/30-vpnroute
    mode: "0755"

- name: Register vpn routing table
  lineinfile:
    path: /etc/iproute2/rt_tables
    line: "99 vpn"
  notify:
    - Restart network
    - Install vpn route

- name: Register the sing-box TUN device with netifd
  uci:
    command: section
    config: network
    type: interface
    name: singbox_tun
    value:
      proto: none
      device: tun0
  notify:
    - Restart network
    - Install vpn route

- name: Configure sing-box firewall zone
  uci:
    command: section
    config: firewall
    type: zone
    find_by:
      name: tun
    value:
      forward: REJECT
      output: ACCEPT
      name: tun
      input: REJECT
      masq: 1
      mtu_fix: 1
      device: tun0
      family: ipv4
  notify: Restart firewall

- name: Allow TCP flows created by the sing-box system TUN stack
  uci:
    command: section
    config: firewall
    type: rule
    find_by:
      name: Allow TUN TCP client flows
    value:
      src: tun
      src_ip: 172.16.250.2
      dest_ip: 172.16.250.1
      proto: tcp
      dest_port: 32768-60999
      target: ACCEPT
      family: ipv4
  when: getdomains_download_interface == 'tun0'
  notify: Restart firewall

- name: Remove the local TUN client flow rule when another download interface is selected
  uci:
    command: absent
    config: firewall
    type: rule
    find_by:
      name: Allow TUN TCP client flows
  when: getdomains_download_interface != 'tun0'
  notify: Restart firewall

- name: Configure LAN forwarding to sing-box
  uci:
    command: section
    config: firewall
    type: forwarding
    find_by:
      name: lan-tun
    value:
      dest: tun
      src: lan
      family: ipv4
  notify: Restart firewall

- name: Install starter sing-box configuration
  template:
    src: sing-box-json.j2
    dest: /etc/sing-box/config.json
    mode: "0600"
    force: false
  notify: Restart sing-box

- name: Configure sing-box service
  template:
    src: config-sing-box.j2
    dest: /etc/config/sing-box
    mode: "0600"
  notify: Restart sing-box

- name: Configure marked traffic routing rule
  uci:
    command: section
    config: network
    type: rule
    find_by:
      name: mark0x1
    value:
      mark: "0x1"
      priority: 100
      lookup: vpn
  notify:
    - Restart network
    - Install vpn route

- name: Route locally bound tun0 downloads through the vpn table
  uci:
    command: section
    config: network
    type: rule
    find_by:
      name: tun0_download
    value:
      out: singbox_tun
      priority: 90
      lookup: vpn
  when: getdomains_download_interface == 'tun0'
  notify:
    - Restart network
    - Install vpn route

- name: Remove the tun0 download rule when another interface is selected
  uci:
    command: absent
    config: network
    type: rule
    find_by:
      name: tun0_download
  when: getdomains_download_interface != 'tun0'
  notify:
    - Restart network
    - Install vpn route

- name: Configure enabled destination sets
  uci:
    command: section
    config: firewall
    type: ipset
    find_by:
      name: "{{ item.name }}"
    value: "{{ {'match': 'dst_net'} | combine({'loadfile': item.loadfile} if item.loadfile else {}) }}"
  loop:
    - { name: vpn_domains, enabled: "{{ list_domains }}", loadfile: "" }
    - { name: vpn_subnets, enabled: "{{ list_subnet }}", loadfile: /tmp/lst/subnet.lst }
    - { name: vpn_ip, enabled: "{{ list_ip }}", loadfile: /tmp/lst/ip.lst }
    - { name: vpn_community, enabled: "{{ list_community }}", loadfile: /tmp/lst/community.lst }
  when: item.enabled | bool
  notify: Restart firewall

- name: Configure mark rules for enabled sets
  uci:
    command: section
    config: firewall
    type: rule
    find_by:
      name: "mark_{{ item.rule }}"
    value:
      src: lan
      dest: "*"
      proto: all
      ipset: "{{ item.name }}"
      set_mark: "0x1"
      target: MARK
      family: ipv4
  loop:
    - { name: vpn_domains, rule: domains, enabled: "{{ list_domains }}" }
    - { name: vpn_subnets, rule: subnet, enabled: "{{ list_subnet }}" }
    - { name: vpn_ip, rule: ip, enabled: "{{ list_ip }}" }
    - { name: vpn_community, rule: community, enabled: "{{ list_community }}" }
  when: item.enabled | bool
  notify: Restart firewall

- name: Mark router-local traffic to domain-set destinations
  uci:
    command: section
    config: firewall
    type: rule
    find_by:
      name: mark_local_domains
    value:
      dest: "*"
      proto: all
      ipset: vpn_domains
      set_mark: "0x1"
      target: MARK
      family: ipv4
  when: list_domains | bool
  notify: Restart firewall

- name: Remove the router-local domain mark rule when disabled
  uci:
    command: absent
    config: firewall
    type: rule
    find_by:
      name: mark_local_domains
  when: not list_domains | bool
  notify: Restart firewall

- name: Remove disabled destination sets
  uci:
    command: absent
    config: firewall
    type: ipset
    find_by:
      name: "{{ item.name }}"
  loop:
    - { name: vpn_domains, enabled: "{{ list_domains }}" }
    - { name: vpn_subnets, enabled: "{{ list_subnet }}" }
    - { name: vpn_ip, enabled: "{{ list_ip }}" }
    - { name: vpn_community, enabled: "{{ list_community }}" }
  when: not item.enabled | bool
  notify: Restart firewall

- name: Remove mark rules for disabled sets
  uci:
    command: absent
    config: firewall
    type: rule
    find_by:
      name: "mark_{{ item.rule }}"
  loop:
    - { rule: domains, enabled: "{{ list_domains }}" }
    - { rule: subnet, enabled: "{{ list_subnet }}" }
    - { rule: ip, enabled: "{{ list_ip }}" }
    - { rule: community, enabled: "{{ list_community }}" }
  when: not item.enabled | bool
  notify: Restart firewall

- name: Install selected encrypted DNS resolver with apk
  shell: "apk info -e {{ item }} >/dev/null 2>&1 || apk add {{ item }}"
  loop: "{{ [dns_encrypt] if dns_encrypt in ['dnscrypt-proxy2', 'stubby'] else [] }}"
  register: apk_dns
  changed_when: "'Installing' in apk_dns.stdout or 'OK:' in apk_dns.stdout"

- name: Configure dnsmasq upstream for encrypted DNS
  uci:
    command: set
    key: dhcp.@dnsmasq[0]
    value:
      noresolv: 1
      server: "{{ '127.0.0.53#53' if dns_encrypt == 'dnscrypt-proxy2' else '127.0.0.1#5453' }}"
  when: dns_encrypt in ['dnscrypt-proxy2', 'stubby']
  notify: Restart dnsmasq

- name: Commit firewall configuration
  uci:
    command: commit
    config: firewall

- name: Commit network configuration
  uci:
    command: commit
    config: network

- name: Commit DHCP configuration
  uci:
    command: commit
    config: dhcp
