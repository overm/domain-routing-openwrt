---

  - name: require OpenWrt 24.10 or newer
    assert:
      that:
        - ansible_distribution_major_version | int >= 24
      fail_msg: "This role supports OpenWrt 24.10 and newer only."

  - name: require sing-box tunnel
    assert:
      that:
        - tunnel == "singbox"
      fail_msg: "singbox is the only supported tunnel."

  - name: detect package manager
    shell: if command -v apk >/dev/null 2>&1; then echo apk; else echo opkg; fi
    register: openwrt_package_manager
    changed_when: false

  - name: check whether dnsmasq-full is installed
    shell: >-
      if [ "{{ openwrt_package_manager.stdout }}" = apk ]; then
      apk info -e dnsmasq-full; else opkg list-installed dnsmasq-full; fi
    register: dnsmasqfull_status
    changed_when: false
    failed_when: false

  - name: install required packages
    shell: >-
      if [ "{{ openwrt_package_manager.stdout }}" = apk ]; then
      apk add sing-box curl{% if nano %} nano{% endif %}; else
      opkg install sing-box curl{% if nano %} nano{% endif %}; fi
    changed_when: false

  - name: install dnsmasq-full
    shell: >-
      if [ "{{ openwrt_package_manager.stdout }}" = apk ]; then
      apk add --force-overwrite dnsmasq-full; else
      opkg update && cd /tmp && opkg download dnsmasq-full &&
      opkg remove dnsmasq && opkg install dnsmasq-full --cache /tmp/;
      [ ! -f /etc/config/dhcp-opkg ] ||
      { cp /etc/config/dhcp /etc/config/dhcp-old && mv /etc/config/dhcp-opkg /etc/config/dhcp; }; fi
    when: list_domains and dnsmasqfull_status.rc != 0
    notify:
      - Restart dnsmasq

  - name: set dnsmasq confdir
    uci:
      command: set
      key: dhcp.@dnsmasq[0]
      value:
        confdir: "/tmp/dnsmasq.d"
    notify:
      - Restart dnsmasq

  - name: copy getdomains script
    template:
      src: openwrt-getdomains.j2
      dest: /etc/init.d/getdomains
      mode: a+x
      trim_blocks: false
    notify:
      - Run getdomains script

  - name: enable getdomains at boot
    file:
      src: /etc/init.d/getdomains
      dest: /etc/rc.d/S99getdomains
      state: link
    notify:
      - Run getdomains script

  - name: schedule getdomains update
    lineinfile:
      path: /etc/crontabs/root
      create: yes
      line: "0 4 * * * /etc/init.d/getdomains start"

  - name: enable cron
    service:
      name: cron
      state: started
      enabled: yes

  - name: install sing-box route hotplug script
    template:
      src: openwrt-30-vpnroute.j2
      dest: /etc/hotplug.d/iface/30-vpnroute
      mode: "0755"

  - name: register vpn routing table
    lineinfile:
      path: /etc/iproute2/rt_tables
      line: "99 vpn"
    notify:
      - Restart network

  - name: configure sing-box firewall zone
    uci:
      command: section
      config: firewall
      type: zone
      find_by:
        name: singbox
      value:
        forward: ACCEPT
        output: ACCEPT
        input: ACCEPT
        masq: 1
        mtu_fix: 1
        device: tun0
        family: ipv4
    notify:
      - Restart firewall

  - name: configure LAN forwarding to sing-box
    uci:
      command: section
      config: firewall
      type: forwarding
      find_by:
        name: singbox-lan
      value:
        dest: singbox
        src: lan
        family: ipv4
    notify:
      - Restart firewall

  - name: install sing-box JSON template
    template:
      src: sing-box-json.j2
      dest: /etc/sing-box/config.json
      mode: "0644"

  - name: install sing-box UCI config
    template:
      src: config-sing-box.j2
      dest: /etc/config/sing-box
      mode: "0600"

# Configure network
       
  - name: set rule mark0x1
    uci:
      command: section
      config: network
      type: rule
      find_by:
        name: mark0x1
      value:
        mark: "0x1"
        priority: 100
        lookup: vpn

  - name: uci commit firewall
    uci:
      command: commit
      config: firewall
    notify:
      - Restart firewall

  - name: uci commit network
    uci:
      command: commit
      config: network
    notify:
      - Restart network

# Configure firewall

  - name: add nft set for subnet
    uci:
       command: section
       config: firewall
       type: ipset
       find_by:
         name: vpn_subnets
       value:
         match: dst_net
         loadfile: /tmp/lst/subnet.lst
    when: list_subnet
         
  - name: add nft set for IP
    uci:
       command: section
       config: firewall
       type: ipset
       find_by:
         name: vpn_ip
       value:
         match: dst_net
         loadfile: /tmp/lst/ip.lst
    when: list_ip

  - name: add nft set for community
    uci:
       command: section
       config: firewall
       type: ipset
       find_by:
         name: vpn_community
       value:
         match: dst_net
         loadfile: /tmp/lst/community.lst
    when: list_community

  - name: add nft set for domains
    uci:
       command: section
       config: firewall
       type: ipset
       find_by:
         name: vpn_domains
       value:
         match: dst_net
    when: list_domains

  - name: add mark rule vpn_subnet
    uci:
       command: section
       config: firewall
       type: rule
       find_by:
         name: mark_subnet
       value:
         src: lan
         dest: "*"
         proto: all
         ipset: vpn_subnets
         set_mark: "0x1"
         target: MARK
         family: ipv4
    when: list_subnet

  - name: add mark rule vpn_ip
    uci:
       command: section
       config: firewall
       type: rule
       find_by:
         name: mark_ip
       value:
         src: lan
         dest: "*"
         proto: all
         ipset: vpn_ip
         set_mark: "0x1"
         target: MARK
         family: ipv4
    when: list_ip

  - name: add mark rule vpn_community
    uci:
       command: section
       config: firewall
       type: rule
       find_by:
         name: mark_community
       value:
         src: lan
         dest: "*"
         proto: all
         ipset: vpn_community
         set_mark: "0x1"
         target: MARK
         family: ipv4
    when: list_community

  - name: add mark rule vpn_domains
    uci:
       command: section
       config: firewall
       type: rule
       find_by:
         name: mark_domains
       value:
         src: lan
         dest: "*"
         proto: all
         ipset: vpn_domains
         set_mark: "0x1"
         target: MARK
         family: ipv4
    when: list_domains


# Remove unused rules and ipset
  - name: Remove ipset for ip
    uci:
       command: absent
       config: firewall
       type: ipset
       find_by:
         name: vpn_ip
    when: not list_ip

  - name: Remove rule for ip
    uci:
       command: absent
       config: firewall
       type: rule
       find_by:
         name: mark_ip
    when: not list_ip

  - name: Remove ipset for subnet
    uci:
       command: absent
       config: firewall
       type: ipset
       find_by:
         name: vpn_subnets
    when: not list_subnet

  - name: Remove rule for subnet
    uci:
       command: absent
       config: firewall
       type: rule
       find_by:
         name: mark_subnet
    when: not list_subnet

  - name: Remove ipset for community
    uci:
       command: absent
       config: firewall
       type: ipset
       find_by:
         name: vpn_community
    when: not list_community

  - name: Remove rule for community
    uci:
       command: absent
       config: firewall
       type: rule
       find_by:
         name: mark_community
    when: not list_community

  - name: Remove ipset for domains
    uci:
       command: absent
       config: firewall
       type: ipset
       find_by:
         name: vpn_domains
    when: not list_domains

  - name: Remove rule for domains
    uci:
       command: absent
       config: firewall
       type: rule
       find_by:
         name: mark_domains
    when: not list_domains

# Configure DNS resolver

  - name: install dnscrypt-proxy2
    shell: >-
      if command -v apk >/dev/null 2>&1; then apk add dnscrypt-proxy2;
      else opkg install dnscrypt-proxy2; fi
    when: dns_encrypt == "dnscrypt"
    changed_when: false

  - name: check string in dnscrypt-proxy.toml
    shell: grep "# server_names" /etc/dnscrypt-proxy2/dnscrypt-proxy.toml
    register: check_server_names
    ignore_errors: true
    when: dns_encrypt == "dnscrypt"

  - name: dnscrypt2 enable exact servers
    lineinfile:
      path: /etc/dnscrypt-proxy2/dnscrypt-proxy.toml
      regexp: "# server_names ="
      line: "server_names = ['google', 'cloudflare', 'scaleway-fr', 'yandex']"
    when: dns_encrypt == "dnscrypt" and check_server_names.stdout
    notify:
      - Restart dnscrypt-proxy
    
  - name: edit dhcp config. add localhost server
    lineinfile:
      path: /etc/config/dhcp
      firstmatch: "true"
      insertafter: "option leasefile '/tmp/dhcp.leases'"
      line: "{{ item }}"
    with_items:
      - "        list server '127.0.0.53#53'"
      - "        option noresolv '1'"
    notify:
      - Restart dnsmasq
    when: dns_encrypt == "dnscrypt"

  - name: install stubby
    shell: >-
      if command -v apk >/dev/null 2>&1; then apk add stubby;
      else opkg install stubby; fi
    when: dns_encrypt == "stubby"
    changed_when: false

  - name: edit dhcp config. add localhost server
    lineinfile:
      path: /etc/config/dhcp
      firstmatch: "true"
      insertafter: "option leasefile '/tmp/dhcp.leases'"
      line: "{{ item }}"
    with_items:
      - "        list server '127.0.0.1#5453'"
      - "        option noresolv '1'"
    notify:
      - Restart dnsmasq
    when: dns_encrypt == "stubby"

# Commit

  - name: uci commit firewall
    uci:
      command: commit
      config: firewall
    notify:
      - Restart firewall

  - name: uci commit dhcp
    uci:
      command: commit
      config: dhcp
    notify:
      - Restart dnsmasq

  - name: uci commit network
    uci:
      command: commit
      config: network
    notify:
      - Restart network